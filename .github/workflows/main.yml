name: Build VolTrace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validasi Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        continue-on-error: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 25

      - name: Build mod
        id: build
        shell: bash
        run: |
          set +e
          FILE=$(find . -maxdepth 4 -name 'settings.gradle*' | head -n 1)
          if [ -z "$FILE" ]; then echo "::error::settings.gradle tidak ditemukan di repo"; exit 1; fi
          cd "$(dirname "$FILE")"
          sed -i 's/\r$//' gradlew 2>/dev/null
          chmod +x gradlew 2>/dev/null
          CMD=./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-9.8.2-bin.zip -o "$RUNNER_TEMP/g.zip" && unzip -q "$RUNNER_TEMP/g.zip" -d "$RUNNER_TEMP" && CMD="$RUNNER_TEMP/gradle-9.8.2/bin/gradle"
          fi
          OK=0
          for J in 25 21; do
            V="JAVA_HOME_${J}_X64"
            export JAVA_HOME="${!V}"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "=== Build dengan Java $J ==="
            $CMD clean build --stacktrace --console=plain --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs=-Xmx3g 2>&1 | tee "$GITHUB_WORKSPACE/build-java$J.log"
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then OK=1; break; fi
          done
          if [ "$OK" -eq 1 ]; then
            JAR=$(ls build/libs/*.jar | grep -v -E -- '-(sources|dev|javadoc)\.jar$' | head -n 1)
            JAR=$(realpath "$JAR")
            LIST=$(unzip -l "$JAR")
            grep -q "fabric.mod.json" <<< "$LIST" || echo "::warning::fabric.mod.json tidak ada di jar"
            echo "jar=$JAR" >> "$GITHUB_OUTPUT"
            echo "### Mod sudah jadi: $(basename "$JAR")" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Build gagal - salin teks ini dan kirim ke Claude"
              echo '```'
              grep -h -E "error:|FAILED|What went wrong|Caused by|Could not|cannot find symbol|does not exist|Unsupported" "$GITHUB_WORKSPACE"/build-java*.log | head -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload mod jar
        if: steps.build.outputs.jar != ''
        uses: actions/upload-artifact@v6
        with:
          name: VolTrace-mod-jar
          path: ${{ steps.build.outputs.jar }}

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: build-java*.log
          if-no-files-found: ignore

      - name: Release terbaru (branch utama)
        if: steps.build.outputs.jar != '' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JAR: ${{ steps.build.outputs.jar }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" --prerelease --title "VolTrace (build terbaru)" --notes "Build otomatis dari commit $GITHUB_SHA" --target "$GITHUB_SHA"

      - name: Gagal jika jar tidak jadi
        if: steps.build.outputs.jar == ''
        run: exit 1
